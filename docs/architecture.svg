<svg viewBox="0 0 1300 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1300" height="400" fill="#ffffff"/>

  <text x="650" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">GCP E-Commerce Data Pipeline — Architecture</text>

  <!-- Airflow orchestration band -->
  <rect x="15" y="52" width="855" height="66" rx="10" fill="#f3e8fd" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="442" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#6a1b9a">Airflow — orders_pipeline DAG</text>
  <line x1="120" y1="118" x2="120" y2="150" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="335" y1="118" x2="335" y2="150" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="118" x2="550" y2="150" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="765" y1="118" x2="765" y2="150" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Row of 6 stage boxes -->
  <!-- 1: Pub/Sub -->
  <rect x="25" y="150" width="190" height="100" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="120" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#1a73e8">Pub/Sub</text>
  <text x="120" y="212" text-anchor="middle" font-size="12" fill="#3c4043">real order stream</text>
  <text x="120" y="228" text-anchor="middle" font-size="11" fill="#5f6368">(Olist historical data,</text>
  <text x="120" y="242" text-anchor="middle" font-size="11" fill="#5f6368">replayed live)</text>

  <!-- arrow 1->2 -->
  <line x1="215" y1="200" x2="238" y2="200" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2: Apache Beam -->
  <rect x="240" y="150" width="190" height="100" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="335" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">Apache Beam</text>
  <text x="335" y="212" text-anchor="middle" font-size="12" fill="#3c4043">validate + enrich</text>
  <text x="335" y="228" text-anchor="middle" font-size="11" fill="#5f6368">(DirectRunner,</text>
  <text x="335" y="242" text-anchor="middle" font-size="11" fill="#5f6368">Dataflow-ready)</text>

  <!-- arrow 2->3 -->
  <line x1="430" y1="200" x2="453" y2="200" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- dead letter branch -->
  <line x1="335" y1="250" x2="335" y2="285" stroke="#ea4335" stroke-width="1.5" marker-end="url(#arrowred)"/>
  <rect x="245" y="287" width="180" height="55" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="335" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#c5221f">Dead letter</text>
  <text x="335" y="325" text-anchor="middle" font-size="11" fill="#8a2119">invalid records → GCS</text>

  <!-- 3: Cloud Storage -->
  <rect x="455" y="150" width="190" height="100" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="550" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#1a73e8">Cloud Storage</text>
  <text x="550" y="212" text-anchor="middle" font-size="12" fill="#3c4043">landing/ → raw/</text>
  <text x="550" y="228" text-anchor="middle" font-size="11" fill="#5f6368">decouples every</text>
  <text x="550" y="242" text-anchor="middle" font-size="11" fill="#5f6368">stage, replayable</text>

  <!-- arrow 3->4 -->
  <line x1="645" y1="200" x2="668" y2="200" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4: PySpark -->
  <rect x="670" y="150" width="190" height="100" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="765" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">PySpark</text>
  <text x="765" y="212" text-anchor="middle" font-size="12" fill="#3c4043">transform + load</text>
  <text x="765" y="228" text-anchor="middle" font-size="11" fill="#5f6368">types, revenue,</text>
  <text x="765" y="242" text-anchor="middle" font-size="11" fill="#5f6368">order_size, dedupe</text>

  <!-- arrow 4->5 -->
  <line x1="860" y1="200" x2="883" y2="200" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5: BigQuery -->
  <rect x="885" y="150" width="190" height="100" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="980" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#1a73e8">BigQuery</text>
  <text x="980" y="212" text-anchor="middle" font-size="12" fill="#3c4043">warehouse</text>
  <text x="980" y="228" text-anchor="middle" font-size="11" fill="#5f6368">partitioned by date,</text>
  <text x="980" y="242" text-anchor="middle" font-size="11" fill="#5f6368">clustered by status</text>

  <!-- arrow 5->6 -->
  <line x1="1075" y1="200" x2="1098" y2="200" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6: dbt -->
  <rect x="1100" y="150" width="190" height="100" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="1195" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#137333">dbt</text>
  <text x="1195" y="212" text-anchor="middle" font-size="12" fill="#3c4043">staging + marts</text>
  <text x="1195" y="228" text-anchor="middle" font-size="11" fill="#5f6368">stg_orders → fct_orders,</text>
  <text x="1195" y="242" text-anchor="middle" font-size="11" fill="#5f6368">agg_sales_daily</text>

  <text x="650" y="380" text-anchor="middle" font-size="12" font-style="italic" fill="#5f6368">
    Zero-cost, no-GCP-account path (LOCAL_MODE): Pub/Sub → real emulator · Cloud Storage/BigQuery → local files — see README
  </text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea4335"/>
    </marker>
  </defs>
</svg>
