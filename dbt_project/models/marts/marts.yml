version: 2

models:
  - name: fct_orders
    description: >
      Order-line-grain fact table, one row per (order, product) - matches
      stg_orders' grain, since a single Olist order can contain multiple
      products.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - product_id
    columns:
      - name: order_id
        tests:
          - not_null

  - name: agg_sales_daily
    description: >
      Daily order/line counts and revenue, grouped by status and Brazilian
      customer state. Grain is one row per (order_date, status, customer_state).
