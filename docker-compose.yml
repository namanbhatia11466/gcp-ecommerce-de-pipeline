
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: gcp-de-pipeline-airflow:2.8.1-custom
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/key.json
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
  env_file:
    - .env
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./pipeline:/opt/airflow/pipeline
    - ./ingestion:/opt/airflow/ingestion
    - ./scripts:/opt/airflow/scripts
    - ./spark:/opt/airflow/spark
    - ./key.json:/opt/airflow/key.json
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  spark:
    image: apache/spark:3.5.1
    entrypoint: /opt/spark/bin/spark-class
    command: org.apache.spark.deploy.master.Master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/spark/work-dir/key.json
    ports:
      - "9090:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark/work-dir/jobs
      - ./key.json:/opt/spark/work-dir/key.json

  # ── LOCAL_MODE: real Pub/Sub emulator standing in for live GCP ──────────
  # Only needed when running with LOCAL_MODE=true. Not part of the default
  # `docker compose up -d` flow above (which targets the real-GCP path) -
  # start this explicitly with `docker compose --profile local up -d`.
  #
  # GCS is *not* emulated the same way: fake-gcs-server doesn't correctly
  # implement the batch API that Beam's WriteToText needs for its
  # temp-to-final rename step ("Bad response: not multi-part"), a known gap
  # in that project rather than something fixable here. LOCAL_MODE instead
  # points the "bucket" paths at a local ./data/gcs/ directory tree, which
  # Beam and Spark already read/write natively — simpler and fully
  # reliable rather than fighting an emulator that's broken for our case.

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    profiles: ["local"]
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

volumes:
  postgres_data: